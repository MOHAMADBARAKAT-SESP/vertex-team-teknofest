<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VERTEX TEAM | Tactical Unmanned Ground Vehicles</title>
  <!-- SEO Meta Tags -->
  <meta name="description" content="VERTEX TEAM - Designing and engineering high-performance tactical Unmanned Ground Vehicles (UGVs) and autonomous solutions for complex terrains.">
  <meta name="keywords" content="VERTEX TEAM, UGV, Unmanned Ground Vehicle, Robotics, Autonomous Vehicles, Tactical Systems, Defense Industry">
  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="index.css">
</head>
<body class="bg-[#0d1126] text-[#d5d2de] selection:bg-blue-600/30 selection:text-white">

  <!-- Header Section -->
  <header id="main-header" class="fixed top-0 left-0 w-full z-50 transition-all duration-300 py-5 bg-transparent border-b border-transparent">
    <div class="max-w-7xl mx-auto px-6 flex items-center justify-between">
      
      <!-- Logo Container -->
      <a href="#" class="flex items-center gap-3 group">
        <img src="logo2.png" alt="Vertex Team Logo" class="h-12 sm:h-20 md:h-32 w-auto object-contain logo-3d-hover" style="mix-blend-mode: multiply;">
      </a>

      <!-- Right Navigation Actions -->
      <div class="flex items-center gap-6">
        <!-- GitHub Link -->
        <a href="https://github.com/THE-VERTEX-TEAM" target="_blank" class="flex items-center gap-2 text-sm font-semibold text-[#d5d2de] hover:text-blue-400 border border-slate-700/50 rounded-xl px-4 py-2 bg-[#0d1126]/40 backdrop-blur-sm hover:border-blue-500/30 transition-all duration-300 hover:shadow-[0_0_15px_rgba(59,130,246,0.15)]" data-i18n="navGithub">
          <svg class="w-4 h-4 fill-currentColor" viewBox="0 0 24 24">
            <path d="M12 2C6.477 2 2 6.477 2 12c0 4.42 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.008-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.454-1.156-1.11-1.464-1.11-1.464-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.831.092-.646.35-1.086.636-1.336-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.203 2.394.1 2.646.64.699 1.026 1.592 1.026 2.683 0 3.842-2.337 4.687-4.565 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.743 0 .267.18.577.688.479C19.138 20.162 22 16.418 22 12c0-5.523-4.477-10-10-10z"></path>
          </svg>
          GitHub Org
        </a>

        <!-- Language Toggle -->
        <div class="flex items-center gap-2 border border-slate-700/50 rounded-xl px-3 py-1.5 bg-[#0d1126]/40 backdrop-blur-sm text-xs font-semibold">
          <button id="lang-en" class="hover:text-blue-400 transition-colors duration-200 cursor-pointer text-blue-400 font-bold text-glow-blue">EN</button>
          <span class="text-slate-600">/</span>
          <button id="lang-tr" class="hover:text-blue-400 transition-colors duration-200 cursor-pointer text-slate-400">TR</button>
        </div>
      </div>

    </div>
  </header>

  <!-- Hero Section -->
  <section class="relative h-screen w-full flex items-center justify-center overflow-hidden">
    
    <!-- Autoplay Video Background -->
    <video id="hero-video" autoplay loop muted playsinline class="absolute top-0 left-0 w-full h-full object-cover z-0">
      <source src="military car.mp4" type="video/mp4">
    </video>

    <!-- Dark Layered Overlay -->
    <div class="absolute inset-0 bg-gradient-to-t from-[#0d1126] via-[#0d1126]/60 to-[#0d1126]/40 z-10"></div>
    <!-- Overlay grid lines for tech design -->
    <div class="absolute inset-0 bg-[linear-gradient(to_right,rgba(59,130,246,0.03)_1px,transparent_1px),linear-gradient(to_bottom,rgba(59,130,246,0.03)_1px,transparent_1px)] bg-[size:4rem_4rem] z-10"></div>

   <!-- Bottom-Aligned Content -->
<div class="absolute bottom-12 md:bottom-24 left-1/2 transform -translate-x-1/2 z-20 text-center w-full max-w-5xl px-6 flex flex-col items-center">
  
  <!-- Main Title (New) -->
  <h1 data-i18n="heroTitle" class="text-3xl sm:text-5xl lg:text-6xl font-extrabold tracking-tight text-white mb-4 uppercase text-glow leading-tight">
    Next-Gen UGV Technologies
  </h1>

  <!-- Subtitle -->
  <p data-i18n="heroSubtitle" class="text-base sm:text-xl text-gray-300 mb-8 max-w-3xl">
    Engineering the future of defense robotics for TEKNOFEST.
  </p>

  <!-- CTA Button -->
  <button id="hero-cta-btn" class="group relative inline-flex items-center gap-3 bg-gradient-to-r from-blue-600 to-cyan-500 text-white font-bold text-sm tracking-wider uppercase px-8 py-4 rounded-xl shadow-lg hover:shadow-[0_0_30px_rgba(59,130,246,0.5)] transition-all duration-300 transform hover:scale-[1.02] cursor-pointer">
    <span data-i18n="heroCta">Get to know us</span>
    <svg class="w-4 h-4 transform group-hover:translate-x-1 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
    </svg>
  </button>
</div>

    <!-- Floating Audio Toggle Button -->
    <div class="absolute bottom-10 right-10 z-20">
      <button id="audio-toggle-btn" class="flex items-center gap-3 px-4 py-3 bg-[#0d1126]/60 border border-[#d5d2de]/10 backdrop-blur-md rounded-xl hover:bg-[#0d1126]/80 transition-all duration-300 group cursor-pointer shadow-lg hover:border-blue-500/30">
        <!-- Visual wave bars -->
        <span id="audio-wave" class="flex items-end h-3">
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
          <span class="wave-bar"></span>
        </span>
        <span id="audio-status-text" class="text-xs font-semibold uppercase tracking-wider text-[#d5d2de]/90 group-hover:text-white transition-colors" data-i18n="audioOff">
          Audio: Off
        </span>
      </button>
    </div>

  </section>

  <!-- Team Section -->
  <section id="team" class="py-24 md:py-32 relative bg-[#0d1126]">
    <!-- Background visual details -->
    <div class="absolute top-0 right-0 w-96 h-96 bg-blue-600/5 rounded-full filter blur-[100px] pointer-events-none"></div>
    <div class="absolute bottom-0 left-0 w-96 h-96 bg-cyan-500/5 rounded-full filter blur-[100px] pointer-events-none"></div>

    <div class="max-w-7xl mx-auto px-6 relative z-10">
      
      <!-- Section Headers -->
      <div class="text-center max-w-2xl mx-auto mb-20">
        <h2 data-i18n="teamTitle" class="text-3xl md:text-4xl font-extrabold uppercase tracking-wide text-white mb-4 text-glow">
          MEET THE TEAM
        </h2>
        <div class="h-1 w-20 bg-gradient-to-r from-blue-500 to-cyan-400 mx-auto mb-6 rounded-full"></div>
        <p data-i18n="teamSubtitle" class="text-slate-400 font-light leading-relaxed">
          The engineers behind the next generation of tactical unmanned systems.
        </p>
      </div>

      <!-- Team Grid (3 cards top, 2 centered bottom) -->
      <div class="flex flex-col gap-8">
        
        <!-- Top Row: 3 Cards -->
        <div id="team-top-row" class="grid grid-cols-1 md:grid-cols-3 gap-8 justify-center max-w-5xl mx-auto w-full">
          <!-- Dynamically Loaded via app.js -->
        </div>

        <!-- Bottom Row: 2 Cards (Centered) -->
        <div id="team-bottom-row" class="flex flex-col md:flex-row gap-8 justify-center max-w-3xl mx-auto w-full md:px-4">
          <!-- Dynamically Loaded via app.js -->
        </div>

      </div>

    </div>
  </section>

  <!-- Footer Section -->
  <footer class="py-12 border-t border-slate-900 bg-[#0d1126] relative z-10">
    <div class="max-w-7xl mx-auto px-6 text-center">
      <p data-i18n="footerText" class="text-[#d5d2de]/60 text-sm font-semibold tracking-widest uppercase">
        Designed & Engineered By VERTEX TEAM
      </p>
      <p class="text-slate-600 text-xs mt-3">
        &copy; 2026 VERTEX TEAM. All Rights Reserved.
      </p>
    </div>
  </footer>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
